<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Tekrarı - EN/TR Quiz (Copy)</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70;
  --accent:#2f6f4f; --accent2:#c9622a; --good:#2f8f4e; --bad:#c0392b;
  --border:#e6e3dd; --shadow:0 8px 24px rgba(0,0,0,0.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a; --card:#212226; --ink:#f2f1ee; --muted:#a3a3a8;
    --border:#33343a; --shadow:0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#17181a; --card:#212226; --ink:#f2f1ee; --muted:#a3a3a8;
  --border:#33343a; --shadow:0 8px 24px rgba(0,0,0,0.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%; display:flex; justify-content:center;
}
.wrap{width:100%; max-width:520px; padding:20px 16px 32px;}
header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:8px; flex-wrap:wrap;}
h1{font-size:1.15rem; margin:0; font-weight:700;}
.mode-toggle{
  display:flex; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px;
  box-shadow:var(--shadow);
}
.mode-toggle button{
  border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:0.78rem;
  cursor:pointer; color:var(--muted); font-weight:600;
}
.mode-toggle button.active{background:var(--accent); color:#fff;}
.progress-row{display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:var(--muted); margin-bottom:10px;}
.progress-bar{height:6px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:20px;}
.progress-fill{height:100%; background:var(--accent); width:0%; transition:width .25s ease;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); padding:32px 20px; text-align:center; margin-bottom:18px;
}
.qlabel{font-size:0.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; font-weight:600;}
.qword-row{display:flex; align-items:center; justify-content:center; gap:12px;}
.qword{font-size:2rem; font-weight:800; word-break:break-word;}
.sound-btn{
  border:none; background:var(--accent); color:#fff; width:44px; height:44px; min-width:44px;
  border-radius:50%; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); flex-shrink:0;
}
.sound-btn:active{transform:scale(0.93);}
.sound-btn.playing{background:var(--accent2);}
.options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.opt{
  background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:16px 10px;
  font-size:1rem; font-weight:600; cursor:pointer; color:var(--ink); transition:transform .1s ease, background .15s, border-color .15s;
  min-height:56px; display:flex; align-items:center; justify-content:center; text-align:center;
}
.opt:active{transform:scale(0.97);}
.opt.correct{background:var(--good); border-color:var(--good); color:#fff;}
.opt.wrong{background:var(--bad); border-color:var(--bad); color:#fff;}
.opt[disabled]{cursor:default;}
.footer-row{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
.score{font-size:0.85rem; color:var(--muted);}
.restart{
  border:none; background:transparent; color:var(--accent2); font-weight:700; font-size:0.85rem; cursor:pointer;
}
.done{text-align:center; padding:40px 10px;}
.done h2{margin-bottom:6px;}
.done p{color:var(--muted); margin-bottom:22px;}
.done .big{font-size:2.4rem; font-weight:800; color:var(--accent);}
.notice{display:none; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:0.8rem; color:var(--accent); margin-bottom:12px; text-align:center; font-weight:600;}
.progress-fill.retry{background:var(--accent2);}
.btn{
  background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:999px;
  font-weight:700; font-size:0.95rem; cursor:pointer; margin:6px;
}
.btn.secondary{background:transparent; color:var(--accent); border:1.5px solid var(--accent);}
</style>
</head>
<body>

    <h1>📚 Kelime Tekrarı</h1>
    <div class="mode-toggle">

      <button id="modeTrBtn">TR → EN</button>
    </div>
  </header>

  <div class="notice" id="notice">Kaldığın yerden devam ediyorsun ✔</div>
  <div class="progress-row">
    <span id="progressText">0 / 0</span>
    <span class="score" id="scoreText">Doğru: 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quizArea"></div>
  <div class="footer-row"><span class="score"></span><button class="restart" id="restartLink">Baştan başla</button></div>
</div>

const STORE_KEY = 'kelimeTekrari.v2';
let mode = 'en2tr';        // en2tr: soru İngilizce, şıklar Türkçe
let order = [];            // bu turda sorulacak kelime indeksleri
let idx = 0;               // turdaki sıra
let correctCount = 0;      // bu turdaki doğru sayısı
let answered = false;
let phase = 'main';        // 'main' = ilk tur, 'retry' = yanlışların tekrarı
let retryRound = 0;
let wrongSet = [];         // bu turda yanlış yapılanlar
let firstPassCorrect = 0;  // ilk turdaki doğru sayısı
let resumed = false;
let resetArmed = false, resetTimer = null;

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      n: WORDS.length, mode, order, idx, correctCount, phase, retryRound, wrongSet, firstPassCorrect
    }));
  }catch(e){}
}
function clearSave(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || s.n !== WORDS.length || !Array.isArray(s.order) || !Array.isArray(s.wrongSet)) return false;
    const ok = i => Number.isInteger(i) && i>=0 && i<WORDS.length;
    if(!s.order.every(ok) || !s.wrongSet.every(ok)) return false;
    if(!(s.idx>=0 && s.idx<=s.order.length)) return false;
    mode = s.mode==='tr2en' ? 'tr2en' : 'en2tr';
    order = s.order; idx = s.idx; correctCount = s.correctCount|0;
    phase = s.phase==='retry' ? 'retry' : 'main';
    retryRound = s.retryRound|0; wrongSet = s.wrongSet; firstPassCorrect = s.firstPassCorrect|0;
    return true;
  }catch(e){ return false; }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newRound(){
  order = shuffle(WORDS.map((_,i)=>i));
  idx = 0; correctCount = 0; answered = false;
  phase = 'main'; retryRound = 0; wrongSet = []; firstPassCorrect = 0; resumed = false;
  save();
  render();
}

function startRetry(){
  order = shuffle(wrongSet);
  wrongSet = [];
  idx = 0; correctCount = 0; answered = false;
  phase = 'retry'; retryRound++;
  save();
  render();
}

function pickWrongOptions(correctVal, correctIdx, langIndex){
  // Aynı soru metnine sahip başka kelimeler (ör. call/search = aramak) yanlış şık olarak çıkmasın
  const qIndex = 1 - langIndex;
  const qVal = WORDS[correctIdx][qIndex];
  const pool = WORDS.filter((w,i)=>i!==correctIdx && w[qIndex]!==qVal).map(w=>w[langIndex]);
  const shuffled = shuffle(pool);
  const set = new Set([correctVal]);
  const out = [];
  for(const v of shuffled){
    if(!set.has(v)){ set.add(v); out.push(v); }
    if(out.length===3) break;
  }
  return out;
}

function render(){
  const quizArea = document.getElementById('quizArea');
  const total = order.length;
  const shown = Math.min(idx,total);
  document.getElementById('progressText').textContent =
    (phase==='retry' ? `Tekrar turu ${retryRound}: ` : '') + `${shown} / ${total}`;
  document.getElementById('scoreText').textContent = `Doğru: ${correctCount}`;
  document.getElementById('progressFill').style.width = (total? shown/total*100 : 0)+'%';
  document.getElementById('modeEnBtn').classList.toggle('active', mode==='en2tr');
  document.getElementById('modeTrBtn').classList.toggle('active', mode==='tr2en');
  document.getElementById('notice').style.display = (resumed && idx>0) ? 'block' : 'none';
  document.getElementById('progressFill').classList.toggle('retry', phase==='retry');

  if(idx >= total){
    if(phase==='main'){ firstPassCorrect = correctCount; }
    if(wrongSet.length > 0){
      const n = wrongSet.length;
      const intro = phase==='main'
        ? `İlk tur bitti: <b>${firstPassCorrect} / ${WORDS.length}</b> doğru.`
        : `Tekrar turu bitti, ama hâlâ yanlışların var.`;
      save();
      quizArea.innerHTML = `
        <div class="card done">
          <h2>Yanlışları tekrar edelim 🔁</h2>
          <p>${intro}<br>Yanlış yaptığın <b>${n}</b> kelimeyi şimdi bir daha soracağım.</p>
          <button class="btn" id="retryBtn">Başla</button>
        </div>`;
      document.getElementById('retryBtn').onclick = startRetry;
      return;
    }
    clearSave();
    quizArea.innerHTML = `
      <div class="card done">
        <h2>Tebrikler! 🎉</h2>
        <p>${WORDS.length} kelimeyi tamamladın.</p>
        <div class="big">${firstPassCorrect} / ${WORDS.length}</div>
        <p>ilk turda doğru cevap${retryRound>0 ? `<br>Yanlışlarını ${retryRound} tekrar turunda düzelttin.` : ''}</p>
        <button class="btn" id="restartBtn">Tekrar Başla</button>
      </div>`;
    document.getElementById('restartBtn').onclick = newRound;
    return;
  }

  const wordIdx = order[idx];
  const pair = WORDS[wordIdx];
  const qLang = mode==='en2tr' ? 0 : 1;
  const aLang = mode==='en2tr' ? 1 : 0;
  const question = pair[qLang];
  const correctAnswer = pair[aLang];
  const wrongs = pickWrongOptions(correctAnswer, wordIdx, aLang);
  const options = shuffle([correctAnswer, ...wrongs]);

  quizArea.innerHTML = `
    <div class="card">
      <div class="qlabel">${mode==='en2tr' ? 'İngilizce' : 'Türkçe'}${phase==='retry' ? ' · tekrar' : ''}</div>
      <div class="qword-row">
        <div class="qword"></div>
        <button class="sound-btn" id="soundBtn" title="Telaffuzu dinle">🔊</button>
      </div>
    </div>
    <div class="options" id="optionsGrid"></div>
  `;
  quizArea.querySelector('.qword').textContent = question;
  const grid = document.getElementById('optionsGrid');
  const soundBtn = document.getElementById('soundBtn');
  const speakLang = mode==='en2tr' ? 'en-US' : 'tr-TR';
  soundBtn.onclick = ()=> speak(question, speakLang, soundBtn);
  speak(question, speakLang, soundBtn);
  answered = false;
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = ()=> handleAnswer(btn, opt, correctAnswer, grid, wordIdx);
    grid.appendChild(btn);
  });
}

function speak(text, lang, btnEl){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    utter.rate = 0.92;
    if(btnEl){
      btnEl.classList.add('playing');
      utter.onend = ()=> btnEl.classList.remove('playing');
      utter.onerror = ()=> btnEl.classList.remove('playing');
    }
    window.speechSynthesis.speak(utter);
  } catch(e){}
}

function handleAnswer(btn, chosen, correctAnswer, grid, wordIdx){
  if(answered) return;
  answered = true;
  const allBtns = grid.querySelectorAll('.opt');
  allBtns.forEach(b=>b.disabled = true);
  const ok = chosen === correctAnswer;
  if(ok){
    btn.classList.add('correct');
    correctCount++;
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b=>{ if(b.textContent===correctAnswer) b.classList.add('correct'); });
    if(!wrongSet.includes(wordIdx)) wrongSet.push(wordIdx);
  }
  resumed = false;
  idx++;
  save();   // anlık çıkılsa bile ilerleme kayıtlı
  setTimeout(render, ok ? 550 : 1100);
}

document.getElementById('modeEnBtn').onclick = ()=>{ if(mode!=='en2tr'){ mode='en2tr'; newRound(); } };
document.getElementById('modeTrBtn').onclick = ()=>{ if(mode!=='tr2en'){ mode='tr2en'; newRound(); } };

const resetBtn = document.getElementById('restartLink');
resetBtn.onclick = ()=>{
  if(!resetArmed){
    resetArmed = true;
    resetBtn.textContent = 'Emin misin? Tekrar dokun';
    resetTimer = setTimeout(()=>{ resetArmed=false; resetBtn.textContent='Baştan başla'; }, 3000);
  } else {
    clearTimeout(resetTimer); resetArmed=false; resetBtn.textContent='Baştan başla';
    newRound();
  }
};

if(load()){ resumed = true; render(); } else { newRound(); }
</script>
